name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

# Public OSS repo: GitHub-hosted Windows for Tauri (no self-hosted).
jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build sidecar
        run: powershell.exe -ExecutionPolicy Bypass -File python-sidecar/build.ps1

      - name: Install JS deps
        run: pnpm install --frozen-lockfile

      - name: Regenerate bundle icons from base.svg
        run: pnpm tauri icon src-tauri/icons/base.svg

      - name: Clean Rust build (force fresh Windows icon embed)
        run: cargo clean --manifest-path src-tauri/Cargo.toml

      - name: Build Tauri app and create GitHub Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Haul Calc ${{ github.ref_name }}'
          releaseBody: 'See the assets to download and install this version.'
          releaseDraft: false
          prerelease: ${{ contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') }}
          includeUpdaterJson: true

      - name: Upload updater artifacts and latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          powershell.exe -ExecutionPolicy Bypass -File scripts/make-latest-json.ps1 -Tag "${{ github.ref_name }}" -Repo "${{ github.repository }}"
